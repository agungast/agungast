name: Generate Snake Animation

on:
  # Jalankan otomatis setiap 24 jam (pukul 00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  
  # Memungkinkan untuk dijalankan secara manual dari tab Actions
  workflow_dispatch:
  
  # Jalankan otomatis setiap kali ada push di branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generate grafik animasi ular dari github contribution
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-action@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push file hasil generate ke branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}